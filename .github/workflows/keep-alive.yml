# Free Supabase projects pause after a week without traffic, which takes StudyOS
# offline. This makes one tiny read every three days so the database stays awake.
# The URL and anon key are the public ones every visitor's browser already gets;
# row-level security decides what they can read (here: nothing, which is fine).
#
# GitHub turns off scheduled workflows in repositories with no commits for
# 60 days. If that happens, re-enable it from the Actions tab.
name: Keep Supabase awake

on:
  schedule:
    - cron: "41 3 */3 * *"
  workflow_dispatch:

env:
  SUPABASE_URL: https://siydluazjcoakgwfbyxp.supabase.co
  SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpeWRsdWF6amNvYWtnd2ZieXhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NDgxNzAsImV4cCI6MjA5MzUyNDE3MH0.gCcP3VeEtzw2U5ccZFYXFV1TbIzPiub5fF-f7Du2-Ng

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/subjects?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered $status"
          test "$status" = "200"
